name: Regenerate null chunk patch

on:
  push:
    branches:
      - ver/26.2-hardfork

permissions:
  contents: write
  actions: write

env:
  GIT_AUTHOR_NAME: LophinelabsCI
  GIT_AUTHOR_EMAIL: ci@lophinelabs.com
  GIT_COMMITTER_NAME: LophinelabsCI
  GIT_COMMITTER_EMAIL: ci@lophinelabs.com

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[regen-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply Existing Patches
        run: |
          mv lophine-server/minecraft-patches/features/0139-Lophine-Diagnose-and-guard-null-ticking-chunk.patch /tmp/0139.patch
          ./gradlew --refresh-dependencies applyAllPatches

      - name: Edit Real Server Source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = next(Path("lophine-server/src/minecraft/java").rglob("ServerLevel.java"))
          text = source.read_text()
          method = re.search(r"(?m)^\s*public\s+void\s+tickChunk\s*\(", text)
          if method is None:
              raise SystemExit("Could not locate ServerLevel.tickChunk method")
          match = re.search(r"(?m)^([ ]+)(?:final )?ChunkPos [^\n]*= chunk\.getPos\(\);", text[method.start():])
          if match is None:
              raise SystemExit("Could not locate chunk position statement inside tickChunk")

          start = method.start() + match.start()
          indent = match.group(1)
          lines = [
              f"{indent}// Lophine start - diagnose and guard invalid ticking chunk references",
              f"{indent}if (chunk == null) {{",
              f"{indent}    final String threadName = Thread.currentThread().getName();",
              f"{indent}    String suspectedPluginCaller = \"<none in current call stack>\";",
              f"{indent}    for (final StackTraceElement element : Thread.currentThread().getStackTrace()) {{",
              f"{indent}        final String className = element.getClassName();",
              f"{indent}        if (!className.startsWith(\"java.\")",
              f"{indent}                && !className.startsWith(\"jdk.\")",
              f"{indent}                && !className.startsWith(\"sun.\")",
              f"{indent}                && !className.startsWith(\"com.mojang.\")",
              f"{indent}                && !className.startsWith(\"net.minecraft.\")",
              f"{indent}                && !className.startsWith(\"org.bukkit.\")",
              f"{indent}                && !className.startsWith(\"org.spigotmc.\")",
              f"{indent}                && !className.startsWith(\"io.papermc.\")",
              f"{indent}                && !className.startsWith(\"ca.spottedleaf.\")",
              f"{indent}                && !className.startsWith(\"me.earthme.\")",
              f"{indent}                && !className.startsWith(\"org.slf4j.\")",
              f"{indent}                && !className.startsWith(\"org.apache.logging.\")) {{",
              f"{indent}            suspectedPluginCaller = element.toString();",
              f"{indent}            break;",
              f"{indent}        }}",
              f"{indent}    }}",
              f"{indent}    LOGGER.error(\"Lophine detected a null LevelChunk in ServerLevel.tickChunk: world={{}}, tickSpeed={{}}, thread={{}}, suspectedPluginCaller={{}}\",",
              f"{indent}            this.dimension().identifier(), tickSpeed, threadName, suspectedPluginCaller);",
              f"{indent}    LOGGER.error(\"Null LevelChunk diagnostic call stack; invalid chunk lifecycle reference; a missing plugin frame means the triggering asynchronous operation happened earlier.\",",
              f"{indent}            new IllegalStateException(\"null LevelChunk passed to ServerLevel.tickChunk\"));",
              f"{indent}    return;",
              f"{indent}}}",
              f"{indent}// Lophine end - diagnose and guard invalid ticking chunk references",
          ]
          source.write_text(text[:start] + "\n".join(lines) + "\n" + text[start:])
          print(f"edited {source}")
          PY

      - name: Commit Generated Server Change
        run: |
          source_repo="$GITHUB_WORKSPACE/lophine-server/src/minecraft/java"
          actual_repo=$(git -C "$source_repo" rev-parse --show-toplevel)
          if [ "$actual_repo" != "$source_repo" ]; then
            echo "::error::Expected Minecraft source repository at $source_repo, got $actual_repo"
            exit 1
          fi
          source_file="net/minecraft/server/level/ServerLevel.java"
          git -C "$source_repo" ls-files --error-unmatch "$source_file"
          git -C "$source_repo" add -- "$source_file"
          staged=$(git -C "$source_repo" diff --cached --name-only)
          if [ "$staged" != "$source_file" ]; then
            echo "::error::Expected only $source_file staged; got: $staged"
            exit 1
          fi
          git -C "$source_repo" diff --cached --check
          git -C "$source_repo" commit -m "$(cat <<'EOF'
          Lophine: diagnose and guard null ticking chunks
          EOF
          )"

      - name: Generate Patch From Git Commit
        run: |
          source_repo="$GITHUB_WORKSPACE/lophine-server/src/minecraft/java"
          patch="$GITHUB_WORKSPACE/lophine-server/minecraft-patches/features/0139-Lophine-Diagnose-and-guard-null-ticking-chunk.patch"
          git -C "$source_repo" format-patch -1 --stdout --full-index --zero-commit --no-stat --no-signature HEAD > "$patch"
          git -C "$source_repo" diff HEAD^ HEAD --check
          verify_repo=$(mktemp -d "$RUNNER_TEMP/null-chunk-verify.XXXXXX")
          git clone --shared --no-checkout "$source_repo" "$verify_repo"
          git -C "$verify_repo" switch --detach "$(git -C "$source_repo" rev-parse HEAD^)"
          git -C "$verify_repo" am --3way "$patch"
          test "$(git -C "$verify_repo" rev-parse 'HEAD^{tree}')" = "$(git -C "$source_repo" rev-parse 'HEAD^{tree}')"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lophine-server/minecraft-patches/features/0139-Lophine-Diagnose-and-guard-null-ticking-chunk.patch")
          text = p.read_text()
          if "diff --git a/net/minecraft/server/level/ServerLevel.java" not in text:
              raise SystemExit("Generated patch does not contain ServerLevel diff")
          if "if (chunk == null)" not in text:
              raise SystemExit("Generated patch does not contain null guard")
          print(f"generated {p} ({len(text.splitlines())} lines)")
          PY

      - name: Commit Generated Patch
        run: |
          rm -f .github/workflows/regen-null-chunk-patch.yml
          git add lophine-server/minecraft-patches/features/0139-Lophine-Diagnose-and-guard-null-ticking-chunk.patch .github/workflows/regen-null-chunk-patch.yml
          git commit -m "$(cat <<'EOF'
          [regen-generated] Regenerate null chunk diagnostic patch
          EOF
          )"
          git push origin "${GITHUB_REF_NAME}"

      - name: Build Generated Patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f force-release=false -f force-push=false
