name: Sync Upstream

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-ver-26-2-hardfork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ver/26.2-hardfork
      UPSTREAM_REPOSITORY: https://github.com/LophineLabs/Lophine.git
      UPSTREAM_BRANCH: ver/26.2-hardfork

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Lophine Upstream Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --prune upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_BRANCH"
            exit 0
          fi

          restore_local_workflows() {
            mapfile -t changed_workflows < <(git diff --name-only HEAD -- .github/workflows)
            for path in "${changed_workflows[@]}"; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git checkout HEAD -- "$path"
                git add "$path"
              else
                git rm -f -- "$path" 2>/dev/null || true
              fi
            done
          }

          set +e
          git merge --no-ff --no-commit "upstream/$UPSTREAM_BRANCH"
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            # GitHub's built-in token cannot push workflow-file changes. Keep
            # the repository's local workflows while merging all other upstream code.
            restore_local_workflows
            git commit -m "Merge upstream $UPSTREAM_BRANCH"
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for conflict in "${conflicts[@]}"; do
            if [ "$conflict" != "settings.gradle.kts" ] && [[ "$conflict" != .github/workflows/* ]]; then
              echo "Unsupported merge conflict: $conflict"
              git merge --abort
              exit 1
            fi
          done

          if printf '%s\n' "${conflicts[@]}" | grep -qx 'settings.gradle.kts'; then
            echo "Resolving settings.gradle.kts conflict"
            git checkout --theirs -- settings.gradle.kts
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("settings.gradle.kts")
          text = path.read_text(encoding="utf-8")
          replacement = '''gradle.lifecycle.beforeProject {
              val mcVersion = providers.gradleProperty("mcVersion").get().trim()
              // Keep Bukkit.getBukkitVersion() numeric for plugin compatibility.
              // CI build metadata remains available through the jar manifest.
              version = mcVersion
          }'''
          pattern = r"gradle\.lifecycle\.beforeProject \{.*?\n\}"
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("settings.gradle.kts version block was not found")
          path.write_text(updated, encoding="utf-8")
          PY
            git add settings.gradle.kts
          fi

          # Resolve every workflow conflict in favor of the local workflow set.
          restore_local_workflows
          git commit -m "Merge upstream $UPSTREAM_BRANCH (resolve known conflicts)"

      - name: Push merged branch
        run: git push origin "HEAD:$TARGET_BRANCH"
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "{\"ref\":\"${TARGET_BRANCH}\"}"