name: Sync Upstream

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-ver-26-2-hardfork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ver/26.2-hardfork
      UPSTREAM_REPOSITORY: https://github.com/LophineLabs/Lophine.git
      UPSTREAM_BRANCH: ver/26.2-hardfork

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Lophine Upstream Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --prune upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_BRANCH"
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit "upstream/$UPSTREAM_BRANCH"
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            git commit -m "Merge upstream $UPSTREAM_BRANCH"
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for conflict in "${conflicts[@]}"; do
            if [ "$conflict" != "settings.gradle.kts" ] && [ "$conflict" != ".github/workflows/build.yml" ]; then
              echo "Unsupported merge conflict: $conflict"
              git merge --abort
              exit 1
            fi
          done

          if printf '%s\n' "${conflicts[@]}" | grep -qx '.github/workflows/build.yml'; then
            echo "Resolving build.yml conflict by retaining local release workflow"
            git checkout --ours -- .github/workflows/build.yml
            git add .github/workflows/build.yml
          fi

          if printf '%s\n' "${conflicts[@]}" | grep -qx 'settings.gradle.kts'; then
            echo "Resolving settings.gradle.kts conflict"
            git checkout --theirs -- settings.gradle.kts
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("settings.gradle.kts")
          text = path.read_text(encoding="utf-8")
          replacement = '''gradle.lifecycle.beforeProject {
              val mcVersion = providers.gradleProperty("mcVersion").get().trim()
              // Keep Bukkit.getBukkitVersion() numeric for plugin compatibility.
              // CI build metadata remains available through the jar manifest.
              version = mcVersion
          }'''
          pattern = r"gradle\.lifecycle\.beforeProject \{.*?\n\}"
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("settings.gradle.kts version block was not found")
          path.write_text(updated, encoding="utf-8")
          PY
            git add settings.gradle.kts
          fi

          git commit -m "Merge upstream $UPSTREAM_BRANCH (resolve known workflow conflicts)"

      - name: Push merged branch
        run: git push origin "HEAD:$TARGET_BRANCH"
